on:
  push:
    branches:
      - main
permissions:
  contents: write
  issues: write
  pull-requests: write
name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Must use a PAT (not GITHUB_TOKEN) so that the tag push
          # triggers the Release workflow. GITHUB_TOKEN events are
          # blocked from triggering other workflows.
          token: ${{ secrets.RELEASE_PAT }}
          release-type: simple
