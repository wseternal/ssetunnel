version: "3"

vars:
  BIN: ssetunnel
  BUILD_DIR: build
  FRONTEND_DIR: frontend/console
  GIT_SHA:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  VERSION:
    sh: |
      if [ -f version.txt ]; then cat version.txt
      elif V=$(git describe --tags --abbrev=0 2>/dev/null); then echo "${V#v}"
      else echo 0.1.0
      fi
  LDFLAGS: >-
    -X main.Version={{.VERSION}}
    -X main.GitSHA={{.GIT_SHA}}
  DIST: dist
  RELEASE_VERSION: '{{.VERSION | default "dev"}}'
  RELEASE_LDFLAGS: -s -w -X main.Version={{.RELEASE_VERSION}} -X main.GitSHA={{.GIT_SHA}}

tasks:
  modupdate:
    desc: update go modules
    cmds:
    - go get -u ./...
    - go mod tidy -v
  ci:
    desc: Full CI pipeline (build, vet, test)
    cmds:
      - task: go:build
      - task: go:vet
      - task: go:test

  # ── Go ──────────────────────────────────────────────────────────────

  go:build:
    desc: Build Go CLI binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}} ./cmd/ssetunnel

  go:install:
    desc: Build and install binary to ~/bin
    cmds:
      - task: go:build
      - mkdir -p ~/bin
      - cp -af {{.BUILD_DIR}}/{{.BIN}} ~/bin/

  go:test:
    desc: Run Go tests with race detector
    cmds:
      - go test -race -count=1 -timeout 120s ./...

  go:test:cover:
    desc: Run Go tests with coverage report
    cmds:
      - go test -race -coverprofile=coverage.out -timeout 120s ./...
      - go tool cover -html=coverage.out -o coverage.html

  go:vet:
    desc: Run go vet static analysis
    cmds:
      - go vet ./...

  go:fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  go:tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  go:run:
    desc: Run Go CLI (pass CLI_ARGS="..." for arguments)
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/ssetunnel {{.CLI_ARGS}}

  go:release-linux:
    desc: Build Linux amd64+arm64 release binaries
    cmds:
      - mkdir -p {{.DIST}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-linux-amd64 ./cmd/ssetunnel
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-linux-arm64 ./cmd/ssetunnel

  go:release-darwin:
    desc: Build macOS amd64+arm64 release binaries
    cmds:
      - mkdir -p {{.DIST}}
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-darwin-arm64 ./cmd/ssetunnel
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-darwin-amd64 ./cmd/ssetunnel

  go:release-windows:
    desc: Build Windows amd64 release binary
    cmds:
      - mkdir -p {{.DIST}}
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-windows-amd64.exe ./cmd/ssetunnel

  go:release:
    desc: Cross-compile all platforms (static binaries)
    cmds:
      - mkdir -p {{.DIST}}
      - CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-darwin-arm64   ./cmd/ssetunnel
      - CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-darwin-amd64   ./cmd/ssetunnel
      - CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-linux-amd64    ./cmd/ssetunnel
      - CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-linux-arm64    ./cmd/ssetunnel
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-windows-amd64.exe ./cmd/ssetunnel

  go:clean:
    desc: Clean Go build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} dist coverage.out coverage.html

  # ── Frontend ────────────────────────────────────────────────────────

  fe:install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun install

  fe:build:
    desc: Build frontend SPA
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun run build

  fe:dev:
    desc: Run frontend dev server
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun run dev

  fe:clean:
    desc: Clean frontend build output
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - rm -rf dist
