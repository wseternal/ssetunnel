version: "3"

vars:
  BIN: ssetunnel
  BUILD_DIR: build
  FRONTEND_DIR: frontend/console
  GIT_SHA:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  VERSION:
    sh: |
      if [ -f version.txt ]; then cat version.txt
      elif V=$(git describe --tags --abbrev=0 2>/dev/null); then echo "${V#v}"
      else echo 0.1.0
      fi
  LDFLAGS: >-
    -X main.Version={{.VERSION}}
    -X main.GitSHA={{.GIT_SHA}}
  DIST: dist
  RELEASE_VERSION: '{{.VERSION | default "dev"}}'
  RELEASE_LDFLAGS: -s -w -X main.Version={{.RELEASE_VERSION}} -X main.GitSHA={{.GIT_SHA}}
  SIGN_IDENTITY: MyLocalCodeSign

tasks:
  modupdate:
    desc: update go modules
    cmds:
    - go get -u ./...
    - go mod tidy -v
  ci:
    desc: Full CI pipeline (build, vet, test)
    cmds:
      # The committed frontend/console/dist is a build artifact that go:embed
      # bakes into the binary, so CI has to rebuild it and prove it still
      # matches src/ — otherwise a stale bundle ships silently.
      # --frozen-lockfile keeps the rebuild on the exact esbuild/rollup versions
      # the lockfile pins, so the diff below compares like with like.
      - task: fe:ci-install
      - task: fe:ci-build
      - task: fe:dist-drift
      - task: go:build
      - task: go:vet
      - task: go:test
      - task: fe:test

  fe:ci-install:
    desc: Install frontend dependencies at the locked versions (CI only)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun install --frozen-lockfile

  fe:ci-build:
    desc: Rebuild the embedded bundle with no deployment prefix (CI only)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      # VITE_BASE rewrites every asset URL, so a stray value in the environment
      # would rebuild the bundle differently from what the commit ships.
      - env -u VITE_BASE bun run build
      - task: fe:enum-guard

  fe:dist-drift:
    desc: Fail if the committed embedded bundle no longer matches src/
    cmds:
      - |
        if ! git diff --quiet -- frontend/console/dist; then
          echo "ERROR: frontend/console/dist is stale — run 'task fe:build' and commit the result." >&2
          git diff --stat -- frontend/console/dist >&2
          exit 1
        fi
        echo "dist drift check: OK (bundle matches src/)"

  # ── Go ──────────────────────────────────────────────────────────────

  go:build:
    desc: Build Go CLI binary
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BIN}} ./cmd/ssetunnel

  go:test:
    desc: Run Go tests with race detector
    cmds:
      - go test -race -count=1 -timeout 120s ./...

  go:test:cover:
    desc: Run Go tests with coverage report
    cmds:
      - go test -race -coverprofile=coverage.out -timeout 120s ./...
      - go tool cover -html=coverage.out -o coverage.html

  go:vet:
    desc: Run go vet static analysis
    cmds:
      - go vet ./...

  go:fmt:
    desc: Format Go code
    cmds:
      - go fmt ./...

  go:tidy:
    desc: Tidy Go module dependencies
    cmds:
      - go mod tidy

  go:run:
    desc: Run Go CLI (pass CLI_ARGS="..." for arguments)
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" ./cmd/ssetunnel {{.CLI_ARGS}}

  go:release:
    desc: Build native release binary for current platform
    cmds:
      - mkdir -p {{.DIST}}
      - go build -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-{{OS}}-{{ARCH}} ./cmd/ssetunnel

  go:release:signed:
    desc: Build and codesign release binary for current platform
    cmds:
      - task: go:release
      - task: sign

  go:release:install:
    desc: build release binary for current platform, sign it and then install
    cmds:
      - task: go:release
      - task: sign
      - \rm -fr '/Applications/SSE Tunnel.app'
      - mv 'dist/SSE Tunnel.app' /Applications/

  go:release-linux:
    desc: cross compile for linux amd64 binary with purego
    cmds:
      - mkdir -p {{.DIST}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags purego -trimpath -ldflags "{{.RELEASE_LDFLAGS}}" -o {{.DIST}}/{{.BIN}}-linux-amd64 ./cmd/ssetunnel

  go:clean:
    desc: Clean Go build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} dist coverage.out coverage.html

  # ── Code Signing ────────────────────────────────────────────────────

  sign:cert:
    desc: Generate self-signed code-signing certificate and import into Keychain
    cmds:
      - |
        set -euo pipefail
        cat > codesign.cnf <<'EOF'
        [ req ]
        default_bits       = 2048
        distinguished_name = req_distinguished_name
        x509_extensions    = v3_req
        prompt             = no

        [ req_distinguished_name ]
        CN = {{.SIGN_IDENTITY}}

        [ v3_req ]
        basicConstraints = CA:TRUE
        keyUsage = critical, digitalSignature
        extendedKeyUsage = critical, 1.3.6.1.5.5.7.3.3
        EOF
        openssl req -x509 -days 3650 -nodes -newkey rsa:2048 \
          -keyout codesign.key -out codesign.crt -config codesign.cnf
        openssl pkcs12 -export -legacy -in codesign.crt -inkey codesign.key \
          -out codesign.p12 -name "{{.SIGN_IDENTITY}}" -passout pass:12345
        security import codesign.p12 \
          -k ~/Library/Keychains/login.keychain-db -P "12345" -T /usr/bin/codesign
        security add-trusted-cert -d -r trustRoot \
          -k ~/Library/Keychains/login.keychain-db codesign.crt
        rm -f codesign.key codesign.crt codesign.p12 codesign.cnf
        echo "Certificate '{{.SIGN_IDENTITY}}' imported. Verify with: security find-identity -p codesigning -v"

  sign:
    desc: Wrap the release binary in a macOS .app bundle and codesign the bundle (SIGN_BIN=source binary, SIGN_APP=output bundle)
    vars:
      SIGN_BIN: '{{.SIGN_BIN | default (printf "%s/%s-%s-%s" .DIST .BIN OS ARCH)}}'
      SIGN_APP: '{{.SIGN_APP | default (printf "%s/SSE Tunnel.app" .DIST)}}'
    cmds:
      - rm -rf "{{.SIGN_APP}}"
      - mkdir -p "{{.SIGN_APP}}/Contents/MacOS"
      - cp -af "{{.SIGN_BIN}}" "{{.SIGN_APP}}/Contents/MacOS/{{.BIN}}"
      - rm -f "{{.SIGN_BIN}}"
      - |
        cat > "{{.SIGN_APP}}/Contents/Info.plist" <<'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleIdentifier</key>
          <string>wseternal.ssetunnel</string>
          <key>CFBundleName</key>
          <string>SSE Tunnel</string>
          <key>CFBundleExecutable</key>
          <string>ssetunnel</string>
          <key>CFBundlePackageType</key>
          <string>APPL</string>
          <key>CFBundleShortVersionString</key>
          <string>{{.RELEASE_VERSION}}</string>
          <key>CFBundleVersion</key>
          <string>{{.RELEASE_VERSION}}</string>
        </dict>
        </plist>
        EOF
      - plutil -lint "{{.SIGN_APP}}/Contents/Info.plist"
      # if sign failed with "errSecInternalComponent", try `security unlock-keychain ~/Library/Keychains/login.keychain-db`
      - codesign --force --sign "{{.SIGN_IDENTITY}}" "{{.SIGN_APP}}"
      - codesign --verify --deep --strict --verbose=2 "{{.SIGN_APP}}"
      - codesign -d -vvv "{{.SIGN_APP}}"

  # ── Frontend ────────────────────────────────────────────────────────

  fe:install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun install

  fe:build:
    desc: Build frontend SPA
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun run build
      - task: fe:enum-guard

  fe:enum-guard:
    desc: Fail if the built bundle contains a miscompiled TS enum (see docs/rca/001)
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      # esbuild at a low build.target mislowers function-local TS enums (drops
      # the variable), emitting `void 0||(x={})`. In the strict-mode bundle that
      # throws at runtime — it wedged xterm's write loop and froze the cloud
      # shell (see docs/rca/001). Keep build.target at es2022+.
      - |
        # The miscompile shape has LITERAL parentheses. They must stay escaped:
        # written unescaped they become an ERE group, which then only matches the
        # paren-less form esbuild never emits — a guard that silently passes.
        re='void 0\|\|\([A-Za-z_$][A-Za-z0-9_$]*=\{\}\)'

        # Self-test: prove the regex still catches the known-bad shape before
        # trusting it against the bundle, so it cannot rot unnoticed again.
        probe=$(mktemp)
        printf 'x=(void 0||(r={}));\n' > "$probe"
        if ! grep -Eq "$re" "$probe"; then
          echo "ERROR: enum guard regex does not match the known miscompile shape 'void 0||(r={})' — the guard itself is broken, not the build." >&2
          rm -f "$probe"
          exit 1
        fi
        rm -f "$probe"

        # Enumerate once into positional parameters: a second find piped to
        # `grep -q` can SIGPIPE under pipefail and report a healthy build as
        # "emitted nothing". Asset filenames must not contain whitespace.
        set -- $(find dist/assets -name '*.js' -print 2>/dev/null)
        if [ "$#" -eq 0 ]; then
          echo "ERROR: enum guard found no JS files in dist/assets — the build emitted nothing or build.assetsDir moved." >&2
          exit 1
        fi

        # Fail CLOSED on an empty or missing file list rather than reporting a
        # build that produced nothing as clean.
        if grep -lE "$re" "$@" | grep -q .; then
          echo "ERROR: built bundle has a miscompiled TS enum (dropped variable). Keep build.target >= es2022 in vite.config.ts." >&2
          grep -lE "$re" "$@" | head -5 >&2
          exit 1
        fi
        echo "enum-miscompile guard: OK (self-test passed, $# file(s) scanned, 0 sites)"

  fe:dev:
    desc: Run frontend dev server
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun run dev

  fe:test:
    desc: Run frontend contract tests
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - bun test

  fe:clean:
    desc: Clean frontend build output
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - rm -rf dist
