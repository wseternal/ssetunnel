version: '3'

info:
  companyName: "Wseternal"
  productName: "Clix"
  productIdentifier: "com.wseternal.clix"
  description: "ssetunnel desktop client"
  copyright: "© 2026, Wseternal"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - docs
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 generate bindings -clean=true
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
      readiness:
        http: "http://localhost:3001"
        timeout: "60s"
        interval: "200ms"
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations: []
